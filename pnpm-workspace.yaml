packages:
  - "packages/*"

# Require packages to be at least 14 days old before being allowed to be installed
minimumReleaseAge: 20160
# Security fixes locked while younger than 14 days; remove once they have aged past the cutoff.
minimumReleaseAgeExclude:
  - "@oxc-project/types@0.155.0"
  - "@rolldown/binding-android-arm-eabi@1.2.15"
  - "@rolldown/binding-android-arm64@1.2.15"
  - "@rolldown/binding-darwin-arm64@1.2.15"
  - "@rolldown/binding-darwin-x64@1.2.15"
  - "@rolldown/binding-freebsd-x64@1.2.15"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.15"
  - "@rolldown/binding-linux-arm64-gnu@1.2.15"
  - "@rolldown/binding-linux-arm64-musl@1.2.15"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.15"
  - "@rolldown/binding-linux-s390x-gnu@1.2.15"
  - "@rolldown/binding-linux-x64-gnu@1.2.15"
  - "@rolldown/binding-linux-x64-musl@1.2.15"
  - "@rolldown/binding-openharmony-arm64@1.2.15"
  - "@rolldown/binding-win32-arm64-msvc@1.2.15"
  - "@rolldown/binding-win32-x64-msvc@1.2.15"
  - "@rollup/rollup-android-arm-eabi@4.65.0"
  - "@rollup/rollup-android-arm64@4.65.0"
  - "@rollup/rollup-darwin-arm64@4.65.0"
  - "@rollup/rollup-darwin-x64@4.65.0"
  - "@rollup/rollup-freebsd-arm64@4.65.0"
  - "@rollup/rollup-freebsd-x64@4.65.0"
  - "@rollup/rollup-linux-arm-gnueabihf@4.65.0"
  - "@rollup/rollup-linux-arm-musleabihf@4.65.0"
  - "@rollup/rollup-linux-arm64-gnu@4.65.0"
  - "@rollup/rollup-linux-arm64-musl@4.65.0"
  - "@rollup/rollup-linux-loong64-gnu@4.65.0"
  - "@rollup/rollup-linux-loong64-musl@4.65.0"
  - "@rollup/rollup-linux-ppc64-gnu@4.65.0"
  - "@rollup/rollup-linux-ppc64-musl@4.65.0"
  - "@rollup/rollup-linux-riscv64-gnu@4.65.0"
